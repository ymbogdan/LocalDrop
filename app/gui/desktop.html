<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LocalDrop</title>
  <link rel="stylesheet" href="glass.css">
</head>
<body class="desktop">
  <div class="shell">
    <header class="head">
      <div class="logo-wrap"><h1 class="depth" id="logo">LocalDrop</h1></div>
      <div class="top">
        <button class="squish" id="theme" type="button" role="switch" aria-checked="true" aria-label="Stile">
          <span class="squish-knob">
            <img class="squish-moon" src="../../svg-animazioni/moon.svg" alt="">
            <img class="squish-sun" src="../../svg-animazioni/sun.svg" alt="">
          </span>
        </button>
        <button class="glass-ico" id="settings" type="button" aria-label="Impostazioni">
          <span class="glass-glow"></span>
          <span class="gear"></span>
        </button>
      </div>
    </header>
    <section class="glass">
      <h2 class="address-title">Indirizzo - <span class="url" id="url">In attesa della rete…</span></h2>
      <div class="address-line">
        <div class="address-copy">
          <div class="pin">
            <span id="pin-a">000</span>
            <span id="pin-b">000</span>
          </div>
          <button class="primary copy-btn" id="copy" type="button"><img class="btn-ico" src="../../svg-animazioni/cartoon-copy.svg" alt="">Copia indirizzo</button>
        </div>
        <img id="qr" class="qr" alt="Codice QR" hidden>
      </div>
      <div class="folder" id="folder"></div>
    </section>
    <section class="glass">
      <h2 class="with-ico"><img src="../../svg-animazioni/upload.svg" alt="">Verso il telefono</h2>
      <div class="list" id="shares"><p class="empty">Nessun file scelto.</p></div>
      <div class="list" id="sent"></div>
      <div class="row">
        <button class="primary" id="choose" type="button"><img class="btn-ico" src="../../svg-animazioni/upload.svg" alt="">Scegli file</button>
        <button class="ghost" id="clear" type="button"><img class="btn-ico" src="../../svg-animazioni/trash-bin.svg" alt="">Svuota</button>
      </div>
    </section>
    <section class="glass">
      <h2 class="with-ico"><img src="../../svg-animazioni/solid-download.svg" alt="">Dal telefono</h2>
      <p class="empty" id="inbox-empty">Nessun file in attesa.</p>
      <div class="list" id="inbox"></div>
      <label class="folder">Cartella<input id="inbox-folder" class="field"></label>
      <div class="row">
        <button class="ghost" id="inbox-pick" type="button"><img class="btn-ico" src="../../svg-animazioni/folder.svg" alt="">Scegli cartella</button>
      </div>
      <div class="row">
        <button class="primary" id="inbox-save" type="button"><img class="btn-ico" src="../../svg-animazioni/save.svg" alt="">Salva i selezionati</button>
        <button class="ghost" id="inbox-drop" type="button"><img class="btn-ico" src="../../svg-animazioni/trash-bin.svg" alt="">Scarta</button>
      </div>
    </section>
    <section class="glass">
      <h2 class="with-ico"><img src="../../svg-animazioni/history.svg" alt="">Attività</h2>
      <div class="bar"><div id="bar-fill"></div></div>
      <p class="hint" id="bar-label"></p>
      <div class="list activity" id="activity"><p class="empty">Nessun trasferimento.</p></div>
    </section>
  </div>
  <div class="modal" id="modal">
    <div class="sheet">
      <h2 id="modal-title" class="sheet-title">LocalDrop</h2>
      <p id="modal-body"></p>
      <div class="row">
        <button class="ghost" id="modal-no" type="button"><img class="btn-ico" src="../../svg-animazioni/cartoon-close-cross.svg" alt="">Annulla</button>
        <button class="primary" id="modal-yes" type="button"><img class="btn-ico" src="../../svg-animazioni/check.svg" alt="">Conferma</button>
      </div>
    </div>
  </div>
  <div class="modal" id="settings-modal">
    <div class="sheet">
      <h2 class="sheet-title">Impostazioni</h2>
      <label>Nome dispositivo<input id="set-name"></label>
      <label>Cartella download<input id="set-folder"></label>
      <button class="ghost" id="pick-folder" type="button" style="margin-top:8px"><img class="btn-ico" src="../../svg-animazioni/folder.svg" alt="">Scegli cartella</button>
      <label>Dimensione massima<input id="set-limit"></label>
      <label>Trasferimenti simultanei<input id="set-slots"></label>
      <div class="trusted" id="trusted"></div>
      <div class="row">
        <button class="ghost" id="settings-close" type="button"><img class="btn-ico" src="../../svg-animazioni/cartoon-close-cross.svg" alt="">Chiudi</button>
        <button class="primary" id="settings-save" type="button"><img class="btn-ico" src="../../svg-animazioni/save.svg" alt="">Salva</button>
      </div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <script>
    const urlEl = document.getElementById("url");
    const folderEl = document.getElementById("folder");
    const sharesEl = document.getElementById("shares");
    const activityEl = document.getElementById("activity");
    const modal = document.getElementById("modal");
    let promptKind = "";

    function fileMark() {
      const mark = document.createElement("img");
      mark.className = "btn-ico file-mark";
      mark.alt = "";
      mark.src = "../../svg-animazioni/document.svg";
      return mark;
    }

    function toast(text) {
      const node = document.getElementById("toast");
      node.textContent = text;
      node.classList.add("show");
      setTimeout(() => node.classList.remove("show"), 1600);
    }

    function rows(target, items, empty) {
      target.innerHTML = "";
      if (!items.length) {
        const note = document.createElement("p");
        note.className = "empty";
        note.textContent = empty;
        target.appendChild(note);
        return;
      }
      items.forEach((text) => {
        const row = document.createElement("div");
        row.className = "item";
        row.textContent = text;
        target.appendChild(row);
      });
    }

    window.localdrop = {
      link(urls, pin, folder, qr) {
        const ready = urls.length && !urls[0].includes("127.0.0.1");
        urlEl.textContent = ready ? urls[0] : "Collega il cavo e attiva Hotspot personale sul telefono.";
        const image = document.getElementById("qr");
        if (ready && qr) { image.src = qr; image.hidden = false; } else { image.hidden = true; }
        requestAnimationFrame(fitQr);
        const parts = (pin || "000 000").replace(/\D/g, "").padStart(6, "0");
        setPin(parts.slice(0, 3), parts.slice(3, 6));
        folderEl.textContent = folder ? "Cartella predefinita: " + folder : "";
        const inboxFolder = document.getElementById("inbox-folder");
        if (folder && !inboxFolder.value) inboxFolder.value = folder;
      },
      shares(items) {
        sharesEl.innerHTML = "";
        if (!items.length) {
          const note = document.createElement("p");
          note.className = "empty";
          note.textContent = "Nessun file scelto.";
          sharesEl.appendChild(note);
          return;
        }
        items.forEach((item) => {
          const row = document.createElement("div");
          row.className = "item";
          if (item.preview) {
            const img = document.createElement("img");
            img.className = "preview";
            img.src = item.preview;
            row.appendChild(img);
          } else {
            row.appendChild(fileMark());
          }
          row.appendChild(document.createTextNode(item.name));
          sharesEl.appendChild(row);
        });
      },
      sent(items) {
        const box = document.getElementById("sent");
        box.innerHTML = "";
        if (!items.length) return;
        const note = document.createElement("p");
        note.className = "empty";
        note.textContent = "Già inviati. Reinvia senza scegliere di nuovo il file.";
        box.appendChild(note);
        items.forEach((item) => {
          const row = document.createElement("div");
          row.className = "item";
          row.appendChild(fileMark());
          row.appendChild(document.createTextNode(item.name));
          const button = document.createElement("button");
          button.className = "ghost";
          button.type = "button";
          const mark = document.createElement("img");
          mark.className = "btn-ico";
          mark.alt = "";
          mark.src = "../../svg-animazioni/cartoon-square-arrow-right-enter.svg";
          button.appendChild(mark);
          button.appendChild(document.createTextNode("Reinvia"));
          button.style.marginTop = "8px";
          button.style.width = "100%";
          button.onclick = () => pywebview.api.resend_share(item.id);
          row.appendChild(button);
          box.appendChild(row);
        });
      },
      inbox(items) {
        const box = document.getElementById("inbox");
        const empty = document.getElementById("inbox-empty");
        box.innerHTML = "";
        empty.style.display = items.length ? "none" : "block";
        items.forEach((item) => {
          const label = document.createElement("label");
          label.className = "item";
          const input = document.createElement("input");
          input.type = "checkbox";
          input.checked = true;
          input.dataset.id = item.id;
          label.appendChild(input);
          if (item.preview) {
            const img = document.createElement("img");
            img.className = "preview";
            img.src = item.preview;
            label.appendChild(img);
          } else {
            label.appendChild(fileMark());
          }
          label.appendChild(document.createTextNode(" " + item.name));
          if (item.meta && item.meta.length) {
            const meta = document.createElement("div");
            meta.className = "meta";
            meta.textContent = item.meta.join("\n");
            label.appendChild(meta);
          }
          box.appendChild(label);
          const send = document.createElement("button");
          send.className = "ghost";
          send.type = "button";
          const mark = document.createElement("img");
          mark.className = "btn-ico";
          mark.alt = "";
          mark.src = "../../svg-animazioni/cartoon-square-arrow-right-enter.svg";
          send.appendChild(mark);
          send.appendChild(document.createTextNode("Manda al telefono"));
          send.style.marginTop = "8px";
          send.style.width = "100%";
          send.onclick = () => pywebview.api.offer_incoming([item.id]);
          box.appendChild(send);
        });
      },
      log(line) {
        const current = [...activityEl.querySelectorAll(".item")].map((node) => node.textContent);
        current.unshift(line);
        rows(activityEl, current.slice(0, 40), "Nessun trasferimento.");
      },
      progress(item) {
        const pct = item.total ? Math.round(item.sent * 100 / item.total) : 0;
        document.getElementById("bar-fill").style.width = pct + "%";
        document.getElementById("bar-label").textContent = item.name + "  " + pct + "%";
      },
      ask(kind, title, body) {
        promptKind = kind;
        document.getElementById("modal-title").textContent = title;
        document.getElementById("modal-body").textContent = body;
        modal.classList.add("show");
      },
      settings(data) {
        document.getElementById("set-name").value = data.device_name;
        document.getElementById("set-folder").value = data.download_dir;
        document.getElementById("set-limit").value = data.max_file_bytes;
        document.getElementById("set-slots").value = data.max_concurrent_transfers;
        const box = document.getElementById("trusted");
        box.innerHTML = "";
        data.trusted.forEach((item) => {
          const button = document.createElement("button");
          button.className = "ghost";
          button.type = "button";
          button.textContent = "Rimuovi " + item[1];
          button.onclick = () => pywebview.api.forget(item[0]);
          box.appendChild(button);
        });
        document.getElementById("settings-modal").classList.add("show");
      }
    };

    document.getElementById("copy").onclick = async () => {
      const value = urlEl.textContent;
      if (!value.startsWith("http")) return;
      await pywebview.api.copy_text(value);
      toast("Indirizzo copiato");
    };
    function selectedInbox() {
      return [...document.querySelectorAll("#inbox input:checked")].map((node) => node.dataset.id);
    }
    document.getElementById("inbox-pick").onclick = async () => {
      const folder = await pywebview.api.pick_folder();
      if (folder) document.getElementById("inbox-folder").value = folder;
    };
    document.getElementById("inbox-save").onclick = () => {
      pywebview.api.save_incoming(selectedInbox(), document.getElementById("inbox-folder").value);
    };
    document.getElementById("inbox-drop").onclick = () => pywebview.api.discard_incoming(selectedInbox());
    document.getElementById("choose").onclick = () => pywebview.api.choose_files();
    document.getElementById("clear").onclick = () => pywebview.api.clear_shares();
    document.getElementById("settings").onclick = () => pywebview.api.open_settings();
    document.getElementById("settings-close").onclick = () => document.getElementById("settings-modal").classList.remove("show");
    document.getElementById("settings-save").onclick = () => {
      pywebview.api.save_settings(
        document.getElementById("set-name").value,
        document.getElementById("set-folder").value,
        document.getElementById("set-limit").value,
        document.getElementById("set-slots").value
      );
      document.getElementById("settings-modal").classList.remove("show");
    };
    document.getElementById("pick-folder").onclick = async () => {
      const folder = await pywebview.api.pick_folder();
      if (folder) document.getElementById("set-folder").value = folder;
    };
    document.getElementById("modal-yes").onclick = () => { modal.classList.remove("show"); pywebview.api.answer(true); };
    document.getElementById("modal-no").onclick = () => { modal.classList.remove("show"); pywebview.api.answer(false); };
    function fitQr() {
      const image = document.getElementById("qr");
      const pin = document.querySelector(".pin");
      const button = document.getElementById("copy");
      if (!image || image.hidden || !pin || !button) return;
      const size = Math.round(button.getBoundingClientRect().bottom - pin.getBoundingClientRect().top);
      image.style.width = size + "px";
      image.style.height = size + "px";
    }
    new ResizeObserver(fitQr).observe(document.querySelector(".address-copy"));
    function setPin(left, right) {
      document.getElementById("pin-a").textContent = left;
      document.getElementById("pin-b").textContent = right;
      requestAnimationFrame(fitQr);
    }
    setPin("000", "000");
    const logo = document.getElementById("logo");
    const face = logo.textContent;
    logo.textContent = "";
    const faceNode = document.createElement("span");
    faceNode.className = "depth-face";
    faceNode.textContent = face;
    logo.appendChild(faceNode);
    for (let layer = 1; layer <= 34; layer += 1) {
      const slab = document.createElement("span");
      slab.className = "depth-layer";
      slab.setAttribute("aria-hidden", "true");
      slab.textContent = face;
      slab.style.transform = "translateZ(" + (-layer * 2.4) + "px)";
      logo.appendChild(slab);
    }
    let aimX = 0;
    let aimY = 0;
    let tiltX = 0;
    let tiltY = 0;
    let orbit = 0;
    let lastTick = performance.now();
    logo.addEventListener("pointermove", (event) => {
      const box = logo.getBoundingClientRect();
      aimX = ((event.clientX - box.left) / box.width - 0.5) * 16;
      aimY = ((event.clientY - box.top) / box.height - 0.5) * -12;
    });
    logo.addEventListener("pointerleave", () => { aimX = 0; aimY = 0; });
    function spinLogo(now) {
      const step = Math.min(0.05, (now - lastTick) / 1000);
      lastTick = now;
      orbit += 0.35 * step;
      const turnX = Math.sin(orbit) * 7.5;
      const turnY = Math.cos(orbit * 0.8) * 5;
      tiltX += (aimX + turnX - tiltX) * 0.14;
      tiltY += (aimY + turnY - tiltY) * 0.14;
      logo.style.transform = "rotateX(" + tiltY.toFixed(2) + "deg) rotateY(" + tiltX.toFixed(2) + "deg)";
      requestAnimationFrame(spinLogo);
    }
    requestAnimationFrame(spinLogo);
    const themeKey = "localdrop-theme";
    const themeButton = document.getElementById("theme");
    function paintTheme(dark, animate) {
      document.body.classList.toggle("dark", dark);
      themeButton.setAttribute("aria-checked", dark ? "true" : "false");
      if (!animate) return;
      themeButton.classList.add("moving");
      clearTimeout(themeButton._timer);
      themeButton._timer = setTimeout(() => themeButton.classList.remove("moving"), 320);
    }
    paintTheme(localStorage.getItem(themeKey) !== "light", false);
    themeButton.onclick = () => {
      const dark = !document.body.classList.contains("dark");
      localStorage.setItem(themeKey, dark ? "dark" : "light");
      paintTheme(dark, true);
    };
  </script>
</body>
</html>
